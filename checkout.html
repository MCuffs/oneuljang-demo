<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>주문/결제 | 오늘장 마켓</title>
<meta name="user_id" content="">
<script src="dz-head.js"></script>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>
<header id="hdr"></header>
<main>
  <h1>주문/결제</h1>
  <div id="items"></div>
  <form class="f" id="f">
    <label>받는 분<input id="n" required placeholder="이름"></label>
    <label>휴대폰<input id="ph" required placeholder="010-0000-0000"></label>
    <label>주소<input id="ad" required placeholder="배송지 주소"></label>
    <p class="note">데모 사이트입니다. 실제 결제는 일어나지 않으며 입력값은 이 브라우저에만 저장됩니다.</p>
    <button class="btn pri" type="submit" id="pay">결제하기</button>
  </form>
</main>
<footer>주식회사 오늘장 (데모) · <a href="privacy.html">개인정보처리방침</a></footer>
<script>
function page(){
  var c=cart();if(!c.length){location.href="cart.html";return;}
  var sum=0;document.getElementById("items").innerHTML='<table>'+c.map(function(i){var p=PRODUCTS.find(function(x){return x.id===i.id});sum+=p.price*i.qty;return '<tr><td>'+p.name+'</td><td>'+i.qty+'개</td><td>'+won(p.price*i.qty)+'</td></tr>'}).join("")+'</table><div class="total"><span>결제 금액</span><span>'+won(sum)+'</span></div>';
  var u=user();if(u){document.getElementById("n").value=u.name;document.getElementById("ph").value=u.phone||"";}
  document.getElementById("f").onsubmit=function(e){e.preventDefault();var id="O"+Date.now().toString().slice(-8);var orders=store("orders")||[];orders.push({id:id,items:c,sum:sum,at:new Date().toISOString(),name:document.getElementById("n").value});store("orders",orders);store("cart",[]);location.href="complete.html?order="+id;};
}
</script>
</body>
</html>
