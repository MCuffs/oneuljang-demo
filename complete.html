<body>

  <div class="ok" id="ok"></div>

<script>
function page(){
  var o=(store("orders")||[]).find(function(x){return x.id===qs("order")});
  document.getElementById("ok").innerHTML=o?'<h1>주문이 완료되었습니다</h1><p>주문번호 <b>'+o.id+'</b> · 결제 금액 <b>'+won(o.sum)+'</b></p><p class="note">'+o.items.map(function(i){var p=PRODUCTS.find(function(x){return x.id===i.id});return p.name+" "+i.qty+"개"}).join(", ")+'</p>':'<h1>주문 정보를 찾을 수 없습니다</h1>';
}
</script>
